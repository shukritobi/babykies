<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babykies | Status pesanan</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><h1>Status pesanan</h1><p id="status">Semak status pembayaran.</p><a class="btn" href="./">Kembali ke kedai</a></main><script>const id=new URLSearchParams(location.search).get('order');if(id&&!location.hostname.endsWith('.github.io'))fetch('/api/order-status?order='+encodeURIComponent(id)).then(r=>r.json()).then(x=>{document.querySelector('#status').textContent=x.status==='paid'?'Pembayaran disahkan. Terima kasih!':'Pembayaran belum disahkan. Sila hubungi Babykies.';if(x.status==='paid')localStorage.removeItem('babykies-cart')}).catch(()=>{});</script></body></html>
