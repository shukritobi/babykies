name: Mirror original Babykies media
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-media.yml'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/mirror-media.mjs
      - run: npm test
      - name: Commit verified image downloads
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/original public/catalog.js public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Mirror verified Babykies product media"
            git push
          fi
